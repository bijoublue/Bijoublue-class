<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 쑥쑥! 감정 보드게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Jua, Gaegu, Hi Melody - Cute & Round Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Hi+Melody&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Gaegu', 'Hi Melody', cursive, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef2f2 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-jua {
            font-family: 'Jua', 'Gaegu', cursive, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }
        .disco-active {
            animation: discoPulse 0.4s infinite alternate;
        }
        @keyframes discoPulse {
            0% { background-color: #ec4899; transform: scale(1); }
            50% { background-color: #8b5cf6; transform: scale(1.02); }
            100% { background-color: #3b82f6; transform: scale(1); }
        }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between items-center min-h-screen">

    <!-- TOP HEADER -->
    <header class="w-full max-w-5xl mx-auto glass-card rounded-3xl p-4 sm:p-5 mb-4 sm:mb-6 flex flex-wrap justify-between items-center gap-3">

                    학부모 참여수업 - 원하는 활동 칸을 터치하여 함께 감정 활동을 해보세요!
                </p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleSound()" class="px-3.5 py-2 bg-white rounded-2xl text-xs sm:text-sm font-bold text-slate-700 shadow-xs border border-slate-200 hover:bg-slate-50 flex items-center gap-1.5 transition">
                <i id="soundIcon" class="fa-solid fa-volume-high text-rose-500"></i>
                <span id="soundText">음향 켜짐</span>
            </button>
            <button onclick="openEmotionStoryModal()" class="px-3.5 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl text-xs sm:text-sm font-jua shadow-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-book-open"></i>
                <span>감정 이야기</span>
            </button>
            <button onclick="openAdminModal()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl text-xs sm:text-sm font-jua shadow-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-gear text-amber-400"></i>
                <span>관리자</span>
            </button>
        </div>
    </header>

    <!-- MAIN BOARD CONTAINER (EXACTLY 6 TILES) -->
    <main class="w-full max-w-5xl mx-auto flex-1 flex flex-col justify-center gap-4 sm:gap-6 my-2">
        
        <!-- TOP ROW (4 TILES: SECRET BOXES 1 ~ 4) -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-5" id="topRowContainer">
            <!-- Rendered dynamically by JavaScript -->
        </section>

        <!-- BOTTOM ROW (2 TILES: DRAWING & DANCING) -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-5" id="bottomRowContainer">
            <!-- Rendered dynamically by JavaScript -->
        </section>

    </main>

    <!-- ACTION MODAL -->
    <div id="actionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl relative transform transition-all animate-in fade-in zoom-in duration-200">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modalBody">
                <!-- Dynamic Content Injected Here -->
            </div>
        </div>
    </div>

    <footer class="w-full max-w-5xl mx-auto text-center py-3 text-xs text-slate-500 font-semibold">
        ❤️ 마음 쑥쑥 | 학부모 참여수업 감정 보드게임 | 스탠바이미 & 태블릿 최적화
    </footer>

    <script>
        // Audio Toggle & Context
        let isSoundOn = true;
        let audioCtx = null;
        let danceAudioInterval = null;
        let customAudioElement = null;
        let customAudioUrl = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!isSoundOn) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'fanfare') {
                    const notes = [261.63, 329.63, 392.00, 523.25];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.3);
                    });
                } else if (type === 'pop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        function startFastDanceMusic() {
            if (!isSoundOn) return;
            stopDanceMusic();

            if (customAudioUrl) {
                try {
                    customAudioElement = new Audio(customAudioUrl);
                    customAudioElement.currentTime = 0;
                    customAudioElement.play();
                    
                    danceAudioInterval = setTimeout(() => {
                        stopDanceMusic();
                    }, 10000);
                    return;
                } catch(e) {
                    console.log("Custom audio play error", e);
                }
            }

            try {
                const ctx = getAudioContext();
                const startT = ctx.currentTime;
                let currentStep = 0;

                const chords = [
                    [523.25, 659.25, 783.99, 1046.50], 
                    [392.00, 493.88, 587.33, 783.99],  
                    [440.00, 523.25, 659.25, 880.00],  
                    [349.23, 440.00, 523.25, 698.46]   
                ];
                
                const dropMelody = [
                    1046.50, 1046.50, 880.00, 1046.50, 1174.66, 1046.50, 880.00, 783.99,
                    880.00, 880.00, 783.99, 880.00, 1046.50, 880.00, 783.99, 659.25
                ];

                danceAudioInterval = setInterval(() => {
                    const elapsed = ctx.currentTime - startT;
                    if (elapsed >= 10.2) {
                        stopDanceMusic();
                        return;
                    }

                    const now = ctx.currentTime;
                    const chordIdx = Math.floor(currentStep / 4) % chords.length;
                    const chord = chords[chordIdx];

                    if (currentStep % 2 === 0) playPercussion(ctx, now, 'kick', 0.42);
                    if (currentStep % 4 === 2) playPercussion(ctx, now, 'snare', 0.28);
                    else playPercussion(ctx, now, 'hihat', 0.1);

                    chord.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = (idx % 2 === 0) ? 'triangle' : 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.12);
                    });

                    const noteFreq = dropMelody[currentStep % dropMelody.length];
                    playLeadSynth(ctx, now, noteFreq, 'sawtooth', 0.13, 0.15);

                    const bassFreq = chord[0] / 4;
                    playBassSynth(ctx, now, bassFreq, 0.18);

                    currentStep++;
                }, 105);
            } catch(e) {
                console.log("Dance music error", e);
            }
        }

        function playLeadSynth(ctx, time, freq, type, vol, duration) {
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(vol, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(time);
                osc.stop(time + duration);
            } catch(e){}
        }

        function playBassSynth(ctx, time, freq, vol) {
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(vol, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(time);
                osc.stop(time + 0.12);
            } catch(e){}
        }

        function playPercussion(ctx, time, type, vol) {
            try {
                if (type === 'kick') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, time);
                    osc.frequency.exponentialRampToValueAtTime(35, time + 0.08);
                    gain.gain.setValueAtTime(vol, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.08);
                } else if (type === 'snare' || type === 'hihat') {
                    const bufferSize = ctx.sampleRate * (type === 'snare' ? 0.06 : 0.03);
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = (type === 'snare') ? 'bandpass' : 'highpass';
                    filter.frequency.value = (type === 'snare') ? 1200 : 7000;
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(vol, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + (type === 'snare' ? 0.06 : 0.03));
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(time);
                }
            } catch(e){}
        }

        function stopDanceMusic() {
            if (danceAudioInterval) {
                clearInterval(danceAudioInterval);
                clearTimeout(danceAudioInterval);
                danceAudioInterval = null;
            }
            if (customAudioElement) {
                customAudioElement.pause();
                customAudioElement.currentTime = 0;
            }
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (isSoundOn) {
                icon.className = 'fa-solid fa-volume-high text-rose-500';
                text.innerText = '음향 켜짐';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                text.innerText = '음향 끔';
                stopDanceMusic();
            }
        }

        let classStudents = [
            "김민준", "이서연", "박도윤", "최지우", "정하은", 
            "강현우", "윤서아", "임준서", "한소율", "오지호", 
            "신유나", "백시우", "송아린", "류태양", "서은우"
        ];

        const emotionPrompts = [
            { emoji: "😃", name: "기쁜 표정", desc: "눈과 입이 방긋 웃는 행복한 표정" },
            { emoji: "😢", name: "슬픈 표정", desc: "눈물이 글썽글썽 내려오는 표정" },
            { emoji: "😡", name: "화난 표정", desc: "눈썹이 솟구치고 입을 꾹 다문 표정" },
            { emoji: "😲", name: "놀란 표정", desc: "눈과 입이 동그랗게 쩍 벌어진 표정" },
            { emoji: "😆", name: "신난 표정", desc: "눈웃음치며 활짝 미소 짓는 표정" },
            { emoji: "🥰", name: "사랑스러운 표정", desc: "볼이 발그레하고 마음이 따뜻한 표정" },
            { emoji: "😟", name: "걱정스러운 표정", desc: "입꼬리가 내려가고 마음이 조마조마한 표정" },
            { emoji: "😳", name: "부끄러운 표정", desc: "볼이 빨개지고 수줍게 웃는 표정" }
        ];

        let currentEmotion = null;

        let boardTiles = [
            { id: 1, title: "비밀상자 1", type: "secret1", desc: "짝꿍과 오늘 하루 놀이하기!", icon: "fa-gift", color: "from-amber-400 to-amber-500", border: "border-amber-300", bg: "bg-amber-50" },
            { id: 2, title: "비밀상자 2", type: "secret2", desc: "간식상자에서 레모나키즈를 1개 꺼내 먹어요.", icon: "fa-cookie-bite", color: "from-yellow-400 to-amber-400", border: "border-yellow-300", bg: "bg-yellow-50" },
            { id: 3, title: "비밀상자 3", type: "secret3", desc: "꽝! 한 번 쉬기 😅", icon: "fa-face-frown-open", color: "from-orange-400 to-orange-500", border: "border-orange-300", bg: "bg-orange-50" },
            { id: 4, title: "비밀상자 4", type: "secret4", desc: "두 번 쉬기 💤", icon: "fa-bed", color: "from-rose-400 to-rose-500", border: "border-rose-300", bg: "bg-rose-50" },
            { id: 5, title: "그림그리기 🎨", type: "drawing", desc: "이모티콘의 표정을 따라 그려봐요.", icon: "fa-palette", color: "from-indigo-500 to-blue-600", border: "border-indigo-300", bg: "bg-indigo-50" },
            { id: 6, title: "춤추기 💃", type: "dancing", desc: "신나는 음악에 맞춰 춤을 춰요.", icon: "fa-music", color: "from-fuchsia-500 to-pink-600", border: "border-fuchsia-300", bg: "bg-fuchsia-50" }
        ];

        function loadSavedData() {
            try {
                const savedRoster = localStorage.getItem('emotion_board_roster');
                if (savedRoster) classStudents = JSON.parse(savedRoster);

                const savedTiles = localStorage.getItem('emotion_board_tiles');
                if (savedTiles) {
                    const parsed = JSON.parse(savedTiles);
                    parsed.forEach((savedTile, index) => {
                        if (boardTiles[index]) {
                            boardTiles[index].title = savedTile.title;
                            boardTiles[index].desc = savedTile.desc;
                        }
                    });
                }
            } catch(e) {
                console.log("Storage load error", e);
            }
        }

        function renderBoard() {
            const topContainer = document.getElementById('topRowContainer');
            const bottomContainer = document.getElementById('bottomRowContainer');

            topContainer.innerHTML = '';
            bottomContainer.innerHTML = '';

            boardTiles.slice(0, 4).forEach((tile) => {
                const card = createTileCard(tile, "h-56 sm:h-64", true);
                topContainer.appendChild(card);
            });

            boardTiles.slice(4, 6).forEach((tile) => {
                const card = createTileCard(tile, "h-64 sm:h-72", false);
                bottomContainer.appendChild(card);
            });
        }

        function createTileCard(tile, heightClass, isSecret) {
            const card = document.createElement('div');
            card.className = `glass-card ${tile.border} rounded-3xl p-5 sm:p-6 flex flex-col justify-between ${heightClass} cursor-pointer transition-all transform hover:-translate-y-1.5 hover:shadow-xl active:scale-95 group relative overflow-hidden`;
            
            card.onclick = () => triggerTileEvent(tile);

            const displayDesc = isSecret 
                ? "🔒 어떤 미션일까요?<br><span class='text-amber-600 font-bold text-base sm:text-lg'>터치해서 확인하기!</span>" 
                : tile.desc;

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="w-12 h-12 rounded-2xl bg-gradient-to-r ${tile.color} text-white font-jua text-xl sm:text-2xl flex items-center justify-center shadow-md">
                        ${tile.id}
                    </span>
                    <div class="w-12 h-12 rounded-2xl bg-white/80 flex items-center justify-center text-slate-600 text-2xl group-hover:scale-110 transition">
                        <i class="fa-solid ${tile.icon}"></i>
                    </div>
                </div>

                <div class="my-auto text-center px-2">
                    <h3 class="font-jua text-2xl sm:text-3xl md:text-4xl text-slate-800 mb-2 group-hover:text-rose-600 transition leading-snug">${tile.title}</h3>
                    <p class="text-sm sm:text-base md:text-lg text-slate-600 font-semibold leading-relaxed">${displayDesc}</p>
                </div>

                <div class="w-full py-2.5 bg-gradient-to-r ${tile.color} text-white font-jua text-sm sm:text-base md:text-lg text-center rounded-xl shadow-xs flex items-center justify-center gap-2 group-hover:opacity-95 transition">
                    <i class="fa-solid fa-hand-pointer animate-pulse"></i>
                    <span>터치하여 열어보기</span>
                </div>
            `;
            return card;
        }

        function triggerTileEvent(tile) {
            switch(tile.type) {
                case 'secret1': openSecretBox1Modal(tile); break;
                case 'secret2': openSecretBox2Modal(tile); break;
                case 'secret3': openSecretBox3Modal(tile); break;
                case 'secret4': openSecretBox4Modal(tile); break;
                case 'drawing': openDrawingModal(tile); break;
                case 'dancing': openDancingModal(tile); break;
            }
        }

        function openSecretBox1Modal(tile) {
            playSound('pop');
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="text-center">
                    <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-3 shadow-inner">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <span class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold">1번 비밀상자</span>
                    <h2 class="text-2xl font-jua text-slate-800 mt-2">${tile.title}</h2>
                    <p class="text-sm text-slate-600 mt-1 font-semibold">${tile.desc}</p>

                    <div class="my-6 p-5 bg-amber-50 rounded-2xl border-2 border-amber-200 shadow-inner">
                        <div class="text-xs text-amber-700 font-bold mb-1">🤝 오늘 하루 놀이할 짝꿍 🤝</div>
                        <div id="partnerDisplay" class="text-3xl font-jua text-slate-800 py-2">???</div>
                    </div>

                    <button id="pickPartnerBtn" onclick="pickRandomPartner()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-jua text-lg rounded-2xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-dice animate-spin"></i>
                        <span>터치하여 짝꿍 뽑기!</span>
                    </button>
                </div>
            `;
            showModal();
        }

        function pickRandomPartner() {
            playSound('pop');
            const partnerDisplay = document.getElementById('partnerDisplay');
            const btn = document.getElementById('pickPartnerBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            if (!classStudents || classStudents.length === 0) {
                partnerDisplay.innerText = "우리반 친구";
                playSound('fanfare');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                return;
            }

            let count = 0;
            const interval = setInterval(() => {
                const randomName = classStudents[Math.floor(Math.random() * classStudents.length)];
                partnerDisplay.innerText = randomName;
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    const finalPartner = classStudents[Math.floor(Math.random() * classStudents.length)];
                    partnerDisplay.innerHTML = `<span class="text-rose-600 font-extrabold text-4xl animate-bounce inline-block">${finalPartner}</span> 친구!`;
                    playSound('fanfare');
                    btn.innerText = "짝꿍 결정 완료! (닫기)";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    btn.onclick = () => { closeModal(); };
                }
            }, 80);
        }

        function openSecretBox2Modal(tile) {
            playSound('fanfare');
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="text-center">
                    <div class="w-20 h-20 bg-yellow-100 text-yellow-600 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-3 shadow-inner animate-bounce">
                        <i class="fa-solid fa-cookie-bite"></i>
                    </div>

        function initCanvas() {
            canvasElement = document.getElementById('drawingBoard');
            if (!canvasElement) return;
            canvasCtx = canvasElement.getContext('2d');
            
            canvasCtx.lineWidth = 4;
            canvasCtx.lineCap = 'round';
            canvasCtx.lineJoin = 'round';

            function getPos(e) {
                const rect = canvasElement.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvasElement.width / rect.width),
                    y: (clientY - rect.top) * (canvasElement.height / rect.height)
                };
            }

            function startDraw(e) {
                isDrawing = true;
                const pos = getPos(e);
                canvasCtx.beginPath();
                canvasCtx.moveTo(pos.x, pos.y);
                canvasCtx.strokeStyle = currentColor;
            }

            function draw(e) {
                if (!isDrawing) return;
                if (e.touches) e.preventDefault();
                const pos = getPos(e);
                canvasCtx.lineTo(pos.x, pos.y);
                canvasCtx.stroke();
            }

            function stopDraw() {
                isDrawing = false;
                canvasCtx.beginPath();
            }

            canvasElement.onmousedown = startDraw;
            canvasElement.onmousemove = draw;
            canvasElement.onmouseup = stopDraw;
            canvasElement.onmouseleave = stopDraw;

            canvasElement.ontouchstart = startDraw;
            canvasElement.ontouchmove = draw;
            canvasElement.ontouchend = stopDraw;
        }
